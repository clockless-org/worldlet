<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Village · Applet design mockups</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eee8db;color:#293e31;font:15px/1.5 system-ui}
header{display:flex;align-items:center;gap:20px;padding:14px 24px;background:#fffaf0;border-bottom:1px solid #d3c5ab;flex-wrap:wrap}
h1{font:600 22px Georgia;margin:0}label{display:flex;gap:7px;align-items:center}select,button,input{font:inherit;color:inherit}
select{padding:8px 12px;border:1px solid #b7aa8f;border-radius:7px;background:#fffdf7}button{cursor:pointer}
#viewport{position:relative;width:100%;height:calc(100dvh - 130px);min-height:420px;background:#d5cbb6;overflow:hidden}
#plate{position:absolute;pointer-events:none}#surface{position:absolute;background:transparent;border:0}
#companion{display:none;position:absolute;border:2px dashed #527661;border-radius:12px;align-items:center;justify-content:center;color:#234932;background:#e7ffdf45;font:600 13px system-ui}
body.guides #companion{display:flex}body.guides #surface,body.guides .secondary{outline:2px dashed #b7693b}
body.background-only #surface,body.background-only .secondary{visibility:hidden}
body.guides.background-only #surface,body.guides.background-only .secondary{visibility:visible}
body.guides.background-only #surface>*,body.guides.background-only .secondary>*{visibility:hidden}
footer{padding:10px 24px;font-size:12px;display:flex;justify-content:space-between;gap:12px}#status{font-family:ui-monospace,monospace}
#icon{width:54px;height:54px;object-fit:contain}
.secondary{position:absolute;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:Georgia,serif;color:#334635;container-type:size;text-align:center}
.secondary small{font:600 clamp(5px,9cqh,14px) system-ui}.secondary strong{font-size:clamp(12px,40cqh,60px);font-weight:400;line-height:1.1}.secondary span{font-size:clamp(5px,12cqh,16px)}
#gallery{padding:24px}#gallery h2{font:26px Georgia}.gallery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.gallery-grid button{position:relative;padding:0 0 14px;border:1px solid #cabda4;border-radius:10px;overflow:hidden;background:#fffaf0;text-align:left}
.gallery-grid img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}.gallery-grid .gallery-icon{position:absolute;width:64px;height:64px;bottom:4px;right:10px;object-fit:contain}
.gallery-grid span{display:block;padding:12px 80px 0 16px;font-weight:600}
@media(max-width:800px){header{gap:10px;padding:12px}#viewport{height:auto;aspect-ratio:1672/941;min-height:0}#companion{font-size:9px}footer{display:block}footer>span{display:block;margin-bottom:4px}}
</style>
<link rel="stylesheet" href="./preview.css">
<body>
<header><img id="icon" alt=""><h1>Village scene library</h1>
<label>Collection <select id="collection"><option value="apps">Core apps · 18</option><option value="games">Games · 6</option><option value="presets">Generic · 16</option><option value="brands">Branded · 100</option></select></label>
<label>Scene <select id="scene"></select></label>
<label><input type="checkbox" id="guides"> Registration guides</label>
<label><input type="checkbox" id="backgroundOnly"> Background only</label><label><input type="checkbox" id="longContent"> Long-content test</label></header>
<main id="viewport"><img id="plate" alt=""><section id="surface" aria-label="Fictional design sample"></section><span class="sample-label">Design study · Sample data</span><aside id="companion">Companion clearance</aside></main>
<footer><span>40 HTML previews · 100 branded backgrounds · Websites run in the desktop app</span><span id="status"></span></footer>
<div id="gallery"></div><script type="module" src="./preview.js"></script>
</html>
