*{box-sizing:border-box}body{margin:0;background:#eee8db;color:#293e31;font:15px/1.5 system-ui}header{display:flex;align-items:center;gap:20px;padding:14px 24px;background:#fffaf0;border-bottom:1px solid #d3c5ab;flex-wrap:wrap}h1{font:600 22px Georgia;margin:0}label{display:flex;gap:7px;align-items:center}select,button,input,textarea{font:inherit;color:inherit}select,header button{padding:8px 12px;border:1px solid #b7aa8f;border-radius:7px;background:#fffdf7}button{cursor:pointer}#viewport{position:relative;width:100%;height:calc(100dvh - 130px);min-height:420px;background:#d5cbb6;overflow:hidden}#plate{position:absolute;pointer-events:none}#surface{position:absolute;overflow:auto;background:transparent;border:0;scrollbar-width:thin;font-family:Georgia,serif;color:#334635;line-height:1.5;padding:4px;container-type:inline-size}#surface h2{font-size:clamp(22px,4.3cqw,40px);margin:0 0 12px;font-weight:600}#surface p{margin:8px 0}#surface .kicker{font:600 11px system-ui;letter-spacing:.16em;text-transform:uppercase;opacity:.65}#surface button{border:1px solid #ae9262;border-radius:5px;padding:7px 12px;background:linear-gradient(#f8e5b8,#ddc38e);box-shadow:0 2px 0 #987c4b;color:#3d412d}#surface .toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}#surface input,#surface textarea{background:transparent;border:0;border-bottom:1px solid #a79876;padding:6px;min-width:0}#surface textarea{width:100%;min-height:180px;resize:vertical;line-height:1.8}#surface input[type=checkbox]{accent-color:#58754d;width:19px;height:19px}#surface .task{display:flex;align-items:center;gap:14px;border-bottom:1px solid #bcb096;padding:14px 4px}#surface .task:has(input:checked) span{text-decoration:line-through;opacity:.5}#surface .days{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.day{min-height:210px;border-top:2px solid #9c926f;border-bottom:1px solid #a99e7c;padding-top:10px}.day>b{font:600 11px system-ui;opacity:.65}.day>strong{display:block;font-size:26px;font-weight:400;margin:10px 0}.event{display:block;background:#cfd5b3;border:1px solid #adb491;border-radius:3px;padding:8px;font-size:13px;margin:12px 0;box-shadow:1px 2px 3px #0002}.event time{display:block;font-size:11px}.mail{display:grid;grid-template-columns:31% 1fr;gap:22px}.mailnav button{display:block;width:100%;text-align:left;margin:8px 0;background:#e8dec2!important;box-shadow:none!important;font-size:13px}.mailarticle{border-left:1px solid #bbae8d;padding-left:20px}.mailarticle h3{font-size:22px;margin:0 0 12px}#companion{display:none;position:absolute;border:2px dashed #527661;border-radius:12px;align-items:center;justify-content:center;color:#234932;background:#e7ffdf45;font:600 13px system-ui}body.guides #companion{display:flex}body.guides #surface{outline:2px dashed #b7693b}body.background-only #surface{visibility:hidden}footer{padding:10px 24px;font-size:12px;display:flex;justify-content:space-between;gap:12px}#status{font-family:ui-monospace,monospace}#surface form{display:flex;gap:10px;margin-top:20px}#surface form input{flex:1}@media(max-width:800px){header{gap:10px;padding:12px}#viewport{height:65vh;min-height:320px}footer{display:block}.mail{grid-template-columns:1fr}.mailnav{display:none}.mailarticle{border:0;padding:0}#surface{font-size:12px}.day{min-height:120px}.event{padding:4px;font-size:10px}#surface .days{gap:5px}}
#icon{width:54px;height:54px;object-fit:contain}.secondary{position:absolute;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:Georgia,serif;color:#334635;container-type:size;text-align:center}.secondary small{font:600 clamp(8px,9cqh,14px) system-ui}.secondary strong{font-size:clamp(20px,40cqh,60px);font-weight:400;line-height:1.1}.secondary span{font-size:clamp(9px,12cqh,16px)}body.guides .secondary{outline:2px dashed #b7693b}body.background-only .secondary{visibility:hidden}
