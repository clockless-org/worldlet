<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="962" viewBox="0 0 1760 962" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606A"/></marker></defs>
<rect width="1760" height="962" rx="18" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="1759" height="961" rx="18" fill="none" stroke="#D8DDE4"/>
<text x="32" y="48" font-size="26" font-weight="700" fill="#1F2328">Worldlet: four layers, 20 components</text>
<text x="32" y="76" font-size="14" fill="#57606A">Calls go down only: UI asks Agent, Agent reads and writes Context through the Gate, Platform runs all three.</text>
<rect x="24" y="110" width="1100" height="184" rx="14" fill="#EEF4FF" stroke="#B6CCFE"/>
<text x="42" y="140" font-size="20" font-weight="800" fill="#1F4BB8">1 · UI</text>
<text x="132" y="140" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#57606A">ui/</text>
<text x="42" y="162" font-size="13" fill="#57606A">Every screen and its interaction logic. One codebase: every window shows the same UI.</text>
<rect x="42" y="174" width="169" height="106" rx="10" fill="#FFFFFF" stroke="#B6CCFE"/>
<text x="54" y="196" font-size="15" font-weight="700" fill="#1F2328">World</text>
<text x="54" y="214" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#57606A">ui/world/</text>
<text x="54" y="232" font-size="12" fill="#1F2328">The places the person</text>
<text x="54" y="247" font-size="12" fill="#1F2328">moves through, and the</text>
<text x="54" y="262" font-size="12" fill="#1F2328">HUD.</text>
<rect x="221" y="174" width="169" height="106" rx="10" fill="#FFFFFF" stroke="#B6CCFE"/>
<text x="233" y="196" font-size="15" font-weight="700" fill="#1F2328">Applets</text>
<text x="233" y="214" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#57606A">ui/applets/</text>
<text x="233" y="232" font-size="12" fill="#1F2328">Each Applet’s screen, with</text>
<text x="233" y="247" font-size="12" fill="#1F2328">its real website beside</text>
<text x="233" y="262" font-size="12" fill="#1F2328">it.</text>
<rect x="400" y="174" width="169" height="106" rx="10" fill="#FFFFFF" stroke="#B6CCFE"/>
<text x="412" y="196" font-size="15" font-weight="700" fill="#1F2328">Companion</text>
<text x="412" y="214" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#57606A">ui/companion/</text>
<text x="412" y="232" font-size="12" fill="#1F2328">The companion’s face,</text>
<text x="412" y="247" font-size="12" fill="#1F2328">conversation and voice.</text>
<rect x="579" y="174" width="169" height="106" rx="10" fill="#FFFFFF" stroke="#B6CCFE"/>
<text x="591" y="196" font-size="15" font-weight="700" fill="#1F2328">Attention</text>
<text x="591" y="214" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#57606A">ui/attention/</text>
<text x="591" y="232" font-size="12" fill="#1F2328">What needs the person now</text>
<text x="591" y="247" font-size="12" fill="#1F2328">(at most nine), and the</text>
<text x="591" y="262" font-size="12" fill="#1F2328">Journal.</text>
<rect x="758" y="174" width="169" height="106" rx="10" fill="#FFFFFF" stroke="#B6CCFE"/>
<text x="770" y="196" font-size="15" font-weight="700" fill="#1F2328">Frame</text>
<text x="770" y="214" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#57606A">ui/frame/</text>
<text x="770" y="232" font-size="12" fill="#1F2328">The app around it all:</text>
<text x="770" y="247" font-size="12" fill="#1F2328">start, setup, settings,</text>
<text x="770" y="262" font-size="12" fill="#1F2328">navigation.</text>
<rect x="937" y="174" width="169" height="106" rx="10" fill="#FFFFFF" stroke="#B6CCFE"/>
<text x="949" y="196" font-size="15" font-weight="700" fill="#1F2328">Style</text>
<text x="949" y="214" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#57606A">ui/style/</text>
<text x="949" y="232" font-size="12" fill="#1F2328">Shared controls, tokens</text>
<text x="949" y="247" font-size="12" fill="#1F2328">and themes every screen</text>
<text x="949" y="262" font-size="12" fill="#1F2328">draws with.</text>
<rect x="24" y="308" width="1100" height="184" rx="14" fill="#F1F8F3" stroke="#A9D8B8"/>
<text x="42" y="338" font-size="20" font-weight="800" fill="#1A7F37">2 · Agent</text>
<text x="168" y="338" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#57606A">agent/</text>
<text x="42" y="360" font-size="13" fill="#57606A">Who does the work. Every actor, the companion included, passes the Gate.</text>
<rect x="42" y="372" width="169" height="106" rx="10" fill="#FFFFFF" stroke="#A9D8B8"/>
<text x="54" y="394" font-size="15" font-weight="700" fill="#1F2328">Companion</text>
<text x="54" y="412" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#57606A">agent/companion/</text>
<text x="54" y="430" font-size="12" fill="#1F2328">Turns with the person’s</text>
<text x="54" y="445" font-size="12" fill="#1F2328">own Agent; memory; which</text>
<text x="54" y="460" font-size="12" fill="#1F2328">Agent it uses.</text>
<rect x="221" y="372" width="169" height="106" rx="10" fill="#FFFFFF" stroke="#A9D8B8"/>
<text x="233" y="394" font-size="15" font-weight="700" fill="#1F2328">Tasks</text>
<text x="233" y="412" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#57606A">agent/tasks/</text>
<text x="233" y="430" font-size="12" fill="#1F2328">Work without the person:</text>
<text x="233" y="445" font-size="12" fill="#1F2328">routines, checks, drafts.</text>
<rect x="400" y="372" width="169" height="106" rx="10" fill="#FFFFFF" stroke="#A9D8B8"/>
<text x="412" y="394" font-size="15" font-weight="700" fill="#1F2328">Applets</text>
<text x="412" y="412" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#57606A">agent/applets/</text>
<text x="412" y="430" font-size="12" fill="#1F2328">Runs Applets and drives</text>
<text x="412" y="445" font-size="12" fill="#1F2328">the browser for them.</text>
<rect x="579" y="372" width="169" height="106" rx="10" fill="#FFFFFF" stroke="#A9D8B8"/>
<text x="591" y="394" font-size="15" font-weight="700" fill="#1F2328">Attention</text>
<text x="591" y="412" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#57606A">agent/attention/</text>
<text x="591" y="430" font-size="12" fill="#1F2328">Decides what needs the</text>
<text x="591" y="445" font-size="12" fill="#1F2328">person and ranks it.</text>
<rect x="758" y="372" width="169" height="106" rx="10" fill="#1F2328" stroke="#A9D8B8"/>
<text x="770" y="394" font-size="15" font-weight="700" fill="#FFFFFF">Gate</text>
<text x="770" y="412" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#D0D7DE">agent/gate/</text>
<text x="770" y="430" font-size="12" fill="#E6EDF3">Every Agent, its Grants,</text>
<text x="770" y="445" font-size="12" fill="#E6EDF3">World tools, approvals and</text>
<text x="770" y="460" font-size="12" fill="#E6EDF3">audit; local and remote</text>
<text x="770" y="475" font-size="12" fill="#E6EDF3">MCP.</text>
<rect x="937" y="372" width="169" height="106" rx="10" fill="#FFFFFF" stroke="#A9D8B8"/>
<text x="949" y="394" font-size="15" font-weight="700" fill="#1F2328">App rules</text>
<text x="949" y="412" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#57606A">agent/app/</text>
<text x="949" y="430" font-size="12" fill="#1F2328">What the app reports and</text>
<text x="949" y="445" font-size="12" fill="#1F2328">how it updates:</text>
<text x="949" y="460" font-size="12" fill="#1F2328">diagnostics, update</text>
<text x="949" y="475" font-size="12" fill="#1F2328">channels.</text>
<rect x="24" y="506" width="1100" height="184" rx="14" fill="#FFF8EC" stroke="#F0CF8E"/>
<text x="42" y="536" font-size="20" font-weight="800" fill="#9A6700">3 · Context</text>
<text x="192" y="536" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#57606A">context/</text>
<text x="42" y="558" font-size="13" fill="#57606A">Everything the World knows, in one hub on the person’s own machine.</text>
<rect x="42" y="570" width="348" height="106" rx="10" fill="#1F2328" stroke="#F0CF8E"/>
<text x="54" y="592" font-size="15" font-weight="700" fill="#FFFFFF">Store</text>
<text x="54" y="610" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#D0D7DE">context/store/</text>
<text x="54" y="628" font-size="12" fill="#E6EDF3">The hub: every record, one way in and out that decides</text>
<text x="54" y="643" font-size="12" fill="#E6EDF3">and audits each Agent’s call, one search across the</text>
<text x="54" y="658" font-size="12" fill="#E6EDF3">four kinds.</text>
<rect x="400" y="570" width="348" height="106" rx="10" fill="#FFFFFF" stroke="#F0CF8E"/>
<text x="412" y="592" font-size="15" font-weight="700" fill="#1F2328">Applets</text>
<text x="412" y="610" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#57606A">context/applets/</text>
<text x="412" y="628" font-size="12" fill="#1F2328">What Applets exist, what each one recorded, and the</text>
<text x="412" y="643" font-size="12" fill="#1F2328">World log.</text>
<rect x="758" y="570" width="348" height="106" rx="10" fill="#FFFFFF" stroke="#F0CF8E"/>
<text x="770" y="592" font-size="15" font-weight="700" fill="#1F2328">Connectors</text>
<text x="770" y="610" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#57606A">context/connectors/</text>
<text x="770" y="628" font-size="12" fill="#1F2328">Services in and out: sign-in, what they sync, Service</text>
<text x="770" y="643" font-size="12" fill="#1F2328">presets and the board, approved writes.</text>
<rect x="24" y="704" width="1100" height="184" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/>
<text x="42" y="734" font-size="20" font-weight="800" fill="#57606A">4 · Platform</text>
<text x="204" y="734" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#57606A">platform/</text>
<text x="42" y="756" font-size="13" fill="#57606A">Where the World runs, and every window that reaches it.</text>
<rect x="42" y="768" width="205" height="106" rx="10" fill="#1F2328" stroke="#D0D7DE"/>
<text x="54" y="790" font-size="15" font-weight="700" fill="#FFFFFF">Host</text>
<text x="54" y="808" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#D0D7DE">platform/host/</text>
<text x="54" y="826" font-size="12" fill="#E6EDF3">Shared by Desktop and Server.</text>
<text x="54" y="841" font-size="12" fill="#E6EDF3">modules/ and store/ have one</text>
<text x="54" y="856" font-size="12" fill="#E6EDF3">part per component.</text>
<rect x="257" y="768" width="205" height="106" rx="10" fill="#FFFFFF" stroke="#D0D7DE"/>
<text x="269" y="790" font-size="15" font-weight="700" fill="#1F2328">Desktop</text>
<text x="269" y="808" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#57606A">platform/desktop/</text>
<text x="269" y="826" font-size="12" fill="#1F2328">Electron around the Host: the</text>
<text x="269" y="841" font-size="12" fill="#1F2328">window, OS permissions, updates,</text>
<text x="269" y="856" font-size="12" fill="#1F2328">installers.</text>
<rect x="472" y="768" width="205" height="106" rx="10" fill="#FFFFFF" stroke="#D0D7DE"/>
<text x="484" y="790" font-size="15" font-weight="700" fill="#1F2328">Server</text>
<text x="484" y="808" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#57606A">platform/server/</text>
<text x="484" y="826" font-size="12" fill="#1F2328">Node around the Host: the same</text>
<text x="484" y="841" font-size="12" fill="#1F2328">World on an always-on machine,</text>
<text x="484" y="856" font-size="12" fill="#1F2328">no screen.</text>
<rect x="686" y="768" width="205" height="106" rx="10" fill="#FFFFFF" stroke="#D0D7DE"/>
<text x="698" y="790" font-size="15" font-weight="700" fill="#1F2328">Web</text>
<text x="698" y="808" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#57606A">platform/web/</text>
<text x="698" y="826" font-size="12" fill="#1F2328">How any page talks to its host;</text>
<text x="698" y="841" font-size="12" fill="#1F2328">the page a browser opens;</text>
<text x="698" y="856" font-size="12" fill="#1F2328">pairing.</text>
<rect x="901" y="768" width="205" height="106" rx="10" fill="#FFFFFF" stroke="#D0D7DE"/>
<text x="913" y="790" font-size="15" font-weight="700" fill="#1F2328">Phone</text>
<text x="913" y="808" font-size="9.5" font-family="ui-monospace, Menlo, monospace" fill="#57606A">platform/ios/ · platform/android/</text>
<text x="913" y="826" font-size="12" fill="#1F2328">iPhone and Android apps, paired</text>
<text x="913" y="841" font-size="12" fill="#1F2328">the same way.</text>
<line x1="574.0" y1="295" x2="574.0" y2="307" stroke="#57606A" stroke-width="2" marker-end="url(#ar)"/>
<line x1="574.0" y1="493" x2="574.0" y2="505" stroke="#57606A" stroke-width="2" marker-end="url(#ar)"/>
<line x1="574.0" y1="691" x2="574.0" y2="703" stroke="#57606A" stroke-width="2" marker-end="url(#ar)"/>
<text x="1180" y="100" font-size="13" font-weight="700" fill="#57606A">OUTSIDE, AND HOW EACH CONNECTS</text>
<rect x="1180" y="110" width="556" height="184" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/>
<text x="1194" y="136" font-size="15" font-weight="700" fill="#1F2328">The person</text>
<text x="1194" y="158" font-size="12" fill="#1F2328">• Uses the UI in a window</text>
<text x="1194" y="268" font-size="11.5" font-style="italic" fill="#1F4BB8">on the desktop, in a browser or on a phone</text>
<line x1="1177" y1="202.0" x2="1127" y2="202.0" stroke="#1F4BB8" stroke-width="2.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
<rect x="1180" y="308" width="556" height="184" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/>
<text x="1194" y="334" font-size="15" font-weight="700" fill="#1F2328">External Agents</text>
<text x="1194" y="356" font-size="12" fill="#1F2328">• The companion’s Agent: Hermes, Claude Code, OpenClaw…</text>
<text x="1194" y="374" font-size="12" fill="#1F2328">• Local: Claude Code · Codex · scripts</text>
<text x="1194" y="392" font-size="12" fill="#1F2328">• Cloud: claude.ai · ChatGPT · Cursor</text>
<text x="1194" y="466" font-size="11.5" font-style="italic" fill="#1A7F37">adapter · local MCP · remote MCP (OAuth + 4-digit code) → Gate</text>
<line x1="1177" y1="400.0" x2="1127" y2="400.0" stroke="#1A7F37" stroke-width="2.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
<rect x="1180" y="506" width="556" height="184" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/>
<text x="1194" y="532" font-size="15" font-weight="700" fill="#1F2328">Services</text>
<text x="1194" y="554" font-size="12" fill="#1F2328">• Google · GitHub · Notion · Linear · PostHog</text>
<text x="1194" y="572" font-size="12" fill="#1F2328">• Cloudflare · Search Console · HTTP JSON</text>
<text x="1194" y="664" font-size="11.5" font-style="italic" fill="#9A6700">sign in from this machine · reads · approved writes → Connectors</text>
<line x1="1177" y1="598.0" x2="1127" y2="598.0" stroke="#9A6700" stroke-width="2.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
<rect x="1180" y="704" width="556" height="184" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/>
<text x="1194" y="730" font-size="15" font-weight="700" fill="#1F2328">worldlet.ai Worker</text>
<text x="1194" y="752" font-size="12" fill="#1F2328">• Relay for Web, Phone and remote MCP</text>
<text x="1194" y="770" font-size="12" fill="#1F2328">• Forwards only; keeps nothing of a World</text>
<text x="1194" y="862" font-size="11.5" font-style="italic" fill="#57606A">the Host keeps one outbound connection</text>
<line x1="1177" y1="796.0" x2="1127" y2="796.0" stroke="#57606A" stroke-width="2.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="32" y="940" font-size="12" fill="#8C959F">contracts/ holds the interfaces between layers. Models come from the person’s own Agents; Worldlet provides none.</text>
</svg>