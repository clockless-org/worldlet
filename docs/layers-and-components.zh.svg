<text x="1860" y="358" font-size="16" font-weight="700" fill="#1F2328">外部 Agents</text>
<text x="1860" y="384" font-size="12.5" fill="#1F2328">• Fox 用的 Agent（Hermes、Claude Code、OpenClaw…）：适配器</text>
<text x="1860" y="404" font-size="12.5" fill="#1F2328">• 本机：Claude Code · Codex · Hermes · 脚本</text>
<text x="1860" y="424" font-size="12.5" fill="#1F2328">• 云端：claude.ai · ChatGPT · Cursor · token</text>
<text x="1860" y="470" font-size="11.5" fill="#1A7F37" font-style="italic">本地 MCP（stdio → 本机回环）· 远程 MCP 经</text>
<text x="1860" y="486" font-size="11.5" fill="#1A7F37" font-style="italic">mcp.worldlet.ai，OAuth + 4 位码 → 门禁</text>
<line x1="1840" y1="479" x2="1778" y2="479" stroke="#1A7F37" stroke-width="2.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
<rect x="1844" y="510" width="440" height="170" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/>
<text x="1860" y="538" font-size="16" font-weight="700" fill="#1F2328">外部服务</text>
<text x="1860" y="564" font-size="12.5" fill="#1F2328">• Google · GitHub · Notion · Linear</text>
<text x="1860" y="584" font-size="12.5" fill="#1F2328">• PostHog · Cloudflare · Search Console</text>
<text x="1860" y="604" font-size="12.5" fill="#1F2328">• HTTP JSON · 本机自带的数据源</text>
<text x="1860" y="650" font-size="11.5" fill="#9A6700" font-style="italic">登录（OAuth PKCE、device code、key）·</text>
<text x="1860" y="666" font-size="11.5" fill="#9A6700" font-style="italic">API/MCP 读取 · 批准过的写操作 → Connectors</text>
<line x1="1840" y1="595.0" x2="1778" y2="595.0" stroke="#9A6700" stroke-width="2.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
<rect x="1844" y="690" width="440" height="170" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/>
<text x="1860" y="718" font-size="16" font-weight="700" fill="#1F2328">worldlet.ai Worker</text>
<text x="1860" y="744" font-size="12.5" fill="#1F2328">• 远程 MCP、网页和手机配对的中转</text>
<text x="1860" y="764" font-size="12.5" fill="#1F2328">• 只转发，不存任何 World 的数据</text>
<text x="1860" y="784" font-size="12.5" fill="#1F2328">• 更新和下载</text>
<text x="1860" y="830" font-size="11.5" fill="#57606A" font-style="italic">本机主动连出去的一条 WebSocket</text>
<line x1="1840" y1="775.0" x2="1778" y2="775.0" stroke="#57606A" stroke-width="2.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="32" y="896" font-size="12" fill="#8C959F">contracts/ 放各层之间的接口。模型来自用户自己的 Agent，Worldlet 不提供模型。</text>
