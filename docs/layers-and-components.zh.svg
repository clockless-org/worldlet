<text x="1860" y="178" font-size="16" font-weight="700" fill="#1F2328">人和他的窗口</text>
<text x="1860" y="204" font-size="12.5" fill="#1F2328">• 桌面窗口：Electron，本机</text>
<text x="1860" y="224" font-size="12.5" fill="#1F2328">• 任何浏览器：platform/web/，打开 World 的链接</text>
<text x="1860" y="244" font-size="12.5" fill="#1F2328">• iPhone ios/ · Android android/（原生）</text>
<text x="1860" y="290" font-size="11.5" fill="#1F4BB8" font-style="italic">扫码配对 · 端到端加密中转，能直连时走 WebRTC</text>
<line x1="1840" y1="235.0" x2="1778" y2="235.0" stroke="#1F4BB8" stroke-width="2.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
