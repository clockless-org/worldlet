<text x="1844" y="136" font-size="13" font-weight="700" fill="#57606A">OUTSIDE THE WORLD, AND HOW EACH CONNECTS</text>
<rect x="1844" y="150" width="440" height="170" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/>
<text x="1860" y="178" font-size="16" font-weight="700" fill="#1F2328">People and their windows</text>
<text x="1860" y="204" font-size="12.5" fill="#1F2328">• Desktop window: Electron, on this computer</text>
<text x="1860" y="224" font-size="12.5" fill="#1F2328">• Browser anywhere: platform/web/ at the World’s link</text>
<text x="1860" y="244" font-size="12.5" fill="#1F2328">• iPhone ios/ · Android android/ (native)</text>
<text x="1860" y="290" font-size="11.5" fill="#1F4BB8" font-style="italic">paired by QR · end-to-end encrypted relay, WebRTC when direct</text>
<line x1="1840" y1="235.0" x2="1778" y2="235.0" stroke="#1F4BB8" stroke-width="2.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
<rect x="1844" y="330" width="440" height="170" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/>
<text x="1860" y="358" font-size="16" font-weight="700" fill="#1F2328">External Agents</text>
<text x="1860" y="384" font-size="12.5" fill="#1F2328">• Fox’s Agent (Hermes, Claude Code, OpenClaw…): adapter</text>
<text x="1860" y="404" font-size="12.5" fill="#1F2328">• Local: Claude Code · Codex · Hermes · scripts</text>
<text x="1860" y="424" font-size="12.5" fill="#1F2328">• Cloud: claude.ai · ChatGPT · Cursor · tokens</text>
<text x="1860" y="470" font-size="11.5" fill="#1A7F37" font-style="italic">local MCP (stdio → loopback) · remote MCP via mcp.worldlet.ai,</text>
<text x="1860" y="486" font-size="11.5" fill="#1A7F37" font-style="italic">OAuth + 4-digit code → Gate</text>
<line x1="1840" y1="479" x2="1778" y2="479" stroke="#1A7F37" stroke-width="2.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
<rect x="1844" y="510" width="440" height="170" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/>
<text x="1860" y="538" font-size="16" font-weight="700" fill="#1F2328">Services</text>
<text x="1860" y="564" font-size="12.5" fill="#1F2328">• Google · GitHub · Notion · Linear</text>
<text x="1860" y="584" font-size="12.5" fill="#1F2328">• PostHog · Cloudflare · Search Console</text>
<text x="1860" y="604" font-size="12.5" fill="#1F2328">• HTTP JSON · this computer’s own sources</text>
<text x="1860" y="650" font-size="11.5" fill="#9A6700" font-style="italic">sign-in (OAuth PKCE, device code, key) · API/MCP reads ·</text>
<text x="1860" y="666" font-size="11.5" fill="#9A6700" font-style="italic">approved writes → Connectors</text>
<line x1="1840" y1="595.0" x2="1778" y2="595.0" stroke="#9A6700" stroke-width="2.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
<rect x="1844" y="690" width="440" height="170" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/>
<text x="1860" y="718" font-size="16" font-weight="700" fill="#1F2328">worldlet.ai Worker</text>
<text x="1860" y="744" font-size="12.5" fill="#1F2328">• Relay for remote MCP and for web and phone pairing</text>
<text x="1860" y="764" font-size="12.5" fill="#1F2328">• Forwards only, stores nothing of a World</text>
<text x="1860" y="784" font-size="12.5" fill="#1F2328">• Updates and downloads</text>
<text x="1860" y="830" font-size="11.5" fill="#57606A" font-style="italic">one outbound WebSocket from this computer</text>
<line x1="1840" y1="775.0" x2="1778" y2="775.0" stroke="#57606A" stroke-width="2.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="32" y="896" font-size="12" fill="#8C959F">contracts/ holds the interfaces between layers. Models come from the person’s own Agents; Worldlet provides none.</text>
</svg>