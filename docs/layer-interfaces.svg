<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1060" viewBox="0 0 1560 1060" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606A"/></marker></defs>
<rect x="0" y="0" width="1560" height="1060" rx="18" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1"/>
<rect x="0.5" y="0.5" width="1559" height="1059" rx="18" fill="none" stroke="#D8DDE4" stroke-width="1"/>
<text x="28" y="48" font-size="26" font-weight="700" fill="#1F2328">Worldlet: three layers around one Context Store, and their interfaces</text>
<text x="28" y="78" font-size="15" fill="#57606A">Every layer works on the same Store. Outside sources come in only through Connectors; outside Agents come in only through the Gate, over MCP.</text>
<rect x="28" y="94" width="28" height="14" rx="4" fill="#FFF8E6" stroke="#E3B341" stroke-width="1"/>
<text x="64" y="106" font-size="12" fill="#57606A">interface</text>
<rect x="140" y="94" width="28" height="14" rx="4" fill="#FFFFFF" stroke="#57606A" stroke-width="1" stroke-dasharray="6 4"/>
<text x="176" y="106" font-size="12" fill="#57606A">planned, not built yet</text>
<rect x="480" y="120" width="620" height="140" rx="14" fill="#EEF4FF" stroke="#B6CCFE" stroke-width="1"/>
<text x="498" y="148" font-size="20" font-weight="800" fill="#1F4BB8">1 · UI</text>
<text x="572" y="148" font-size="13" fill="#57606A" font-family="ui-monospace, Menlo, monospace">ui/</text>
<text x="620" y="148" font-size="13" fill="#57606A">a dedicated UI on top of the Store; Applets show the Store's things</text>
<rect x="498.0" y="162" width="108.8" height="56" rx="10" fill="#FFFFFF" stroke="#B6CCFE" stroke-width="1"/>
<text x="508.0" y="185" font-size="14" font-weight="700" fill="#1F2328">World</text>
<text x="508.0" y="205" font-size="11" fill="#57606A" font-family="ui-monospace, Menlo, monospace">ui/world/</text>
<rect x="616.8" y="162" width="108.8" height="56" rx="10" fill="#FFFFFF" stroke="#B6CCFE" stroke-width="1"/>
<text x="626.8" y="185" font-size="14" font-weight="700" fill="#1F2328">Applets</text>
<text x="626.8" y="205" font-size="11" fill="#57606A" font-family="ui-monospace, Menlo, monospace">ui/applets/</text>
<rect x="735.6" y="162" width="108.8" height="56" rx="10" fill="#FFFFFF" stroke="#B6CCFE" stroke-width="1"/>
<text x="745.6" y="185" font-size="14" font-weight="700" fill="#1F2328">Companion</text>
<text x="745.6" y="205" font-size="11" fill="#57606A" font-family="ui-monospace, Menlo, monospace">ui/companion/</text>
<rect x="854.4" y="162" width="108.8" height="56" rx="10" fill="#FFFFFF" stroke="#B6CCFE" stroke-width="1"/>
<text x="864.4" y="185" font-size="14" font-weight="700" fill="#1F2328">Attention</text>
<text x="864.4" y="205" font-size="11" fill="#57606A" font-family="ui-monospace, Menlo, monospace">ui/attention/</text>
<rect x="973.2" y="162" width="108.8" height="56" rx="10" fill="#FFFFFF" stroke="#B6CCFE" stroke-width="1"/>
<text x="983.2" y="185" font-size="14" font-weight="700" fill="#1F2328">Settings</text>
<text x="983.2" y="205" font-size="11" fill="#57606A" font-family="ui-monospace, Menlo, monospace">ui/frame/</text>
<text x="498" y="246" font-size="12.5" fill="#57606A">Windows: Desktop · Web (P2P via &lt;room&gt;.worldlet.ai) · Phone, all showing the same UI</text>
<rect x="600" y="270" width="400" height="68" rx="10" fill="#FFF8E6" stroke="#E3B341" stroke-width="1"/>
<text x="612" y="290" font-size="12" font-weight="800" fill="#7A4E00">UI → Agent: actions</text>
<text x="612" y="308" font-size="12.5" fill="#1F2328" font-family="ui-monospace, Menlo, monospace">invoke(operation, json)</text>
<text x="612" y="327" font-size="12" fill="#57606A">agent/index.ts · every change UI makes goes here</text>
<line x1="560" y1="262" x2="560" y2="346" stroke="#57606A" stroke-width="2" marker-end="url(#ar)"/>
<line x1="1060" y1="262" x2="1060" y2="672" stroke="#57606A" stroke-width="2" marker-end="url(#ar)"/>
<text x="1052" y="512" font-size="12" font-weight="700" fill="#7A4E00" transform="rotate(-90 1052 512)">UI → Context: read only</text>
<text x="1052" y="668" font-size="11.5" fill="#7A4E00" font-family="ui-monospace, Menlo, monospace" transform="rotate(-90 1052 668)">contextReader</text>
<rect x="480" y="350" width="540" height="230" rx="14" fill="#F1FAF3" stroke="#9FD8AE" stroke-width="1"/>
<text x="498" y="378" font-size="20" font-weight="800" fill="#1A7F37">2 · Agent</text>
<text x="602" y="378" font-size="13" fill="#57606A" font-family="ui-monospace, Menlo, monospace">agent/</text>
<text x="666" y="378" font-size="13" fill="#57606A">who does the work, and the logic around it</text>
<rect x="498.0" y="390" width="161.33333333333334" height="80" rx="10" fill="#FFFFFF" stroke="#9FD8AE" stroke-width="1"/>
<text x="508.0" y="410" font-size="14" font-weight="700" fill="#1F2328">Chief of staff: Fox</text>
<text x="508.0" y="427" font-size="11" fill="#57606A" font-family="ui-monospace, Menlo, monospace">agent/companion/</text>
<text x="508.0" y="446" font-size="12" fill="#1F2328">the World's face; thinks</text>
<text x="508.0" y="462" font-size="12" fill="#1F2328">with the person's Agent</text>
<rect x="669.3333333333334" y="390" width="161.33333333333334" height="80" rx="10" fill="#FFFFFF" stroke="#9FD8AE" stroke-width="1"/>
<text x="679.3333333333334" y="410" font-size="14" font-weight="700" fill="#1F2328">Workers</text>
<text x="679.3333333333334" y="427" font-size="11" fill="#57606A" font-family="ui-monospace, Menlo, monospace">agent/tasks/, applets/</text>
<text x="679.3333333333334" y="446" font-size="12" fill="#1F2328">routines, checks, Applets</text>
<text x="679.3333333333334" y="462" font-size="12" fill="#1F2328">and every connected Agent</text>
<rect x="840.6666666666667" y="390" width="161.33333333333334" height="80" rx="10" fill="#FFFFFF" stroke="#9FD8AE" stroke-width="1"/>
<text x="850.6666666666667" y="410" font-size="14" font-weight="700" fill="#1F2328">Attention</text>
<text x="850.6666666666667" y="427" font-size="11" fill="#57606A" font-family="ui-monospace, Menlo, monospace">agent/attention/</text>
<text x="850.6666666666667" y="446" font-size="12" fill="#1F2328">decides what reaches</text>
<text x="850.6666666666667" y="462" font-size="12" fill="#1F2328">the person, and when</text>
<text x="498" y="489" font-size="12.5" fill="#1F2328">Agent ↔ Agent: never a direct call; they talk through the Store, so it is all kept.</text>
<text x="498" y="506" font-size="12" fill="#1F2328" font-family="ui-monospace, Menlo, monospace">asks/post → claim → resolve (Recorded)</text>
<rect x="780" y="494" width="212" height="18" rx="5" fill="#FFFFFF" stroke="#57606A" stroke-width="1" stroke-dasharray="6 4"/>
<text x="788" y="507" font-size="11.5" fill="#57606A">planned: Agent conversation records</text>
<rect x="498" y="520" width="504" height="48" rx="10" fill="#DCF2E2" stroke="#1A7F37" stroke-width="1"/>
<text x="510" y="541" font-size="15" font-weight="800" fill="#1A7F37">Gate</text>
<text x="552" y="541" font-size="11" fill="#57606A" font-family="ui-monospace, Menlo, monospace">agent/gate/</text>
<text x="510" y="559" font-size="12" fill="#1F2328">each Agent's identity · Grants · approval card · audit · revoke. Fox passes it too.</text>
<rect x="600" y="592" width="420" height="72" rx="10" fill="#FFF8E6" stroke="#E3B341" stroke-width="1"/>
<text x="612" y="612" font-size="12" font-weight="800" fill="#7A4E00">Agent → Context: World tools, one way in</text>
<text x="612" y="630" font-size="12" fill="#1F2328" font-family="ui-monospace, Menlo, monospace">agentContext(guard, call) · context/store/context.ts</text>
<text x="612" y="649" font-size="12" fill="#57606A">Grant check + one audit record per call; refused runs nothing</text>
<line x1="560" y1="582" x2="560" y2="672" stroke="#57606A" stroke-width="2" marker-end="url(#ar)"/>
<rect x="480" y="676" width="620" height="244" rx="14" fill="#FBF3FF" stroke="#D2A8FF" stroke-width="1"/>
<text x="498" y="704" font-size="20" font-weight="800" fill="#8250DF">3 · Context</text>
<text x="626" y="704" font-size="13" fill="#57606A" font-family="ui-monospace, Menlo, monospace">context/</text>
<text x="702" y="704" font-size="13" fill="#57606A">every source, synced into one Store, organized</text>
<rect x="498" y="718" width="190" height="92" rx="10" fill="#FFFFFF" stroke="#D2A8FF" stroke-width="1"/>
<text x="508" y="739" font-size="14" font-weight="700" fill="#1F2328">Connectors</text>
<text x="508" y="755" font-size="11" fill="#57606A" font-family="ui-monospace, Menlo, monospace">context/connectors/</text>
<text x="508" y="775" font-size="12.5" fill="#1F2328">the only writer of Synced</text>
<text x="508" y="791" font-size="11.5" fill="#1F2328" font-family="ui-monospace, Menlo, monospace">connectorWriter</text>
<rect x="498" y="820" width="190" height="88" rx="10" fill="#FFFFFF" stroke="#D2A8FF" stroke-width="1"/>
<text x="508" y="841" font-size="14" font-weight="700" fill="#1F2328">Applets</text>
<text x="508" y="857" font-size="11" fill="#57606A" font-family="ui-monospace, Menlo, monospace">context/applets/</text>
<text x="508" y="877" font-size="12.5" fill="#1F2328">catalog and each Applet's</text>
<text x="508" y="893" font-size="12.5" fill="#1F2328">records: the things</text>
<line x1="690" y1="765" x2="708" y2="765" stroke="#57606A" stroke-width="2" marker-end="url(#ar)"/>
<rect x="710" y="718" width="372" height="190" rx="10" fill="#FFFFFF" stroke="#8250DF" stroke-width="2"/>
<text x="722" y="740" font-size="16" font-weight="800" fill="#8250DF">Context Store</text>
<text x="722" y="758" font-size="11" fill="#57606A" font-family="ui-monospace, Menlo, monospace">context/store/ · one world.sqlite on your machine</text>
<rect x="722.0" y="768" width="169.0" height="60" rx="8" fill="#F6EEFF" stroke="#D2A8FF" stroke-width="1"/>
<text x="732.0" y="792" font-size="14" font-weight="700" fill="#1F2328">Synced</text>
<text x="732.0" y="812" font-size="11.5" fill="#1F2328">copies of every source</text>
<rect x="901.0" y="768" width="169.0" height="60" rx="8" fill="#F6EEFF" stroke="#D2A8FF" stroke-width="1"/>
<text x="911.0" y="792" font-size="14" font-weight="700" fill="#1F2328">Recorded</text>
<text x="911.0" y="812" font-size="11.5" fill="#1F2328">conversations, asks, logs</text>
<rect x="722.0" y="836" width="169.0" height="60" rx="8" fill="#F6EEFF" stroke="#D2A8FF" stroke-width="1"/>
<text x="732.0" y="860" font-size="14" font-weight="700" fill="#1F2328">Made</text>
<text x="732.0" y="880" font-size="11.5" fill="#1F2328">artifacts, things, drafts</text>
<rect x="901.0" y="836" width="169.0" height="60" rx="8" fill="#F6EEFF" stroke="#D2A8FF" stroke-width="1"/>
<text x="911.0" y="860" font-size="14" font-weight="700" fill="#1F2328">Known</text>
<text x="911.0" y="880" font-size="11.5" fill="#1F2328">memory, profile, knowledge</text>
<rect x="480" y="934" width="620" height="54" rx="12" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
<text x="498" y="958" font-size="15" font-weight="800" fill="#57606A">4 · Platform</text>
<text x="602" y="958" font-size="12" fill="#57606A" font-family="ui-monospace, Menlo, monospace">platform/</text>
<text x="498" y="977" font-size="12" fill="#57606A">runs all three: Desktop (Electron) · Server (Node, no screen) · Web · Phone. No product decisions.</text>
<rect x="20" y="676" width="200" height="244" rx="14" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
<text x="36" y="704" font-size="16" font-weight="800" fill="#1F2328">Outside sources</text>
<text x="36" y="730" font-size="12.5" fill="#1F2328">Gmail · Google Calendar</text>
<text x="36" y="750" font-size="12.5" fill="#1F2328">GitHub · Notion · Linear</text>
<text x="36" y="770" font-size="12.5" fill="#1F2328">Todoist · Supabase</text>
<text x="36" y="790" font-size="12.5" fill="#1F2328">PostHog · Search Console</text>
<text x="36" y="810" font-size="12.5" fill="#1F2328">Cloudflare · any HTTP JSON</text>
<text x="36" y="830" font-size="12.5" fill="#1F2328">files the person imports</text>
<text x="36" y="850" font-size="12.5" fill="#1F2328">browsing and recordings</text>
<rect x="236" y="676" width="228" height="244" rx="10" fill="#FFF8E6" stroke="#E3B341" stroke-width="1"/>
<text x="248" y="696" font-size="12" font-weight="800" fill="#7A4E00">Sources ↔ Context: Connectors</text>
<text x="248" y="718" font-size="12.5" font-weight="700" fill="#1F2328">In</text>
<text x="248" y="735" font-size="12.5" fill="#1F2328">one-click sign-in (OAuth or</text>
<text x="248" y="752" font-size="12.5" fill="#1F2328">device flow), no keys typed</text>
<text x="248" y="769" font-size="12.5" fill="#1F2328">periodic sync → Synced</text>
<text x="248" y="794" font-size="12.5" font-weight="700" fill="#1F2328">Out</text>
<text x="248" y="811" font-size="12.5" fill="#1F2328">an Agent's write becomes a</text>
<text x="248" y="828" font-size="12.5" fill="#1F2328">draft → the person taps</text>
<text x="248" y="845" font-size="12.5" fill="#1F2328">Approve on a card → written</text>
<text x="248" y="862" font-size="12.5" fill="#1F2328">once</text>
<line x1="222" y1="780" x2="234" y2="780" stroke="#57606A" stroke-width="2" marker-end="url(#ar)"/>
<line x1="466" y1="765" x2="496" y2="765" stroke="#57606A" stroke-width="2" marker-end="url(#ar)"/>
<rect x="1360" y="350" width="180" height="230" rx="14" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
<text x="1376" y="378" font-size="16" font-weight="800" fill="#1F2328">Outside Agents</text>
<text x="1376" y="404" font-size="12.5" font-weight="700" fill="#1F2328">The person's own</text>
<text x="1376" y="422" font-size="12.5" fill="#1F2328">Hermes · Claude Code</text>
<text x="1376" y="440" font-size="12.5" fill="#1F2328">Codex</text>
<text x="1376" y="467" font-size="12.5" font-weight="700" fill="#1F2328">Cloud</text>
<text x="1376" y="485" font-size="12.5" fill="#1F2328">ChatGPT · claude.ai</text>
<text x="1376" y="503" font-size="12.5" fill="#1F2328">Cursor</text>
<text x="1376" y="530" font-size="12.5" font-weight="700" fill="#1F2328">Scripts</text>
<text x="1376" y="548" font-size="12.5" fill="#1F2328">ops daemon, reports</text>
<rect x="1076" y="350" width="270" height="312" rx="10" fill="#FFF8E6" stroke="#E3B341" stroke-width="1"/>
<text x="1088" y="370" font-size="12" font-weight="800" fill="#7A4E00">Outside Agents → Gate: MCP</text>
<text x="1088" y="392" font-size="12.5" font-weight="700" fill="#1F2328">Local</text>
<text x="1088" y="409" font-size="12.5" fill="#1F2328">standing worldlet MCP server,</text>
<text x="1088" y="426" font-size="12.5" fill="#1F2328">a new token per Agent each run</text>
<text x="1088" y="451" font-size="12.5" font-weight="700" fill="#1F2328">Cloud</text>
<text x="1088" y="468" font-size="11.5" fill="#1F2328" font-family="ui-monospace, Menlo, monospace">&lt;room&gt;.worldlet.ai/mcp</text>
<text x="1088" y="485" font-size="12.5" fill="#1F2328">OAuth + Allow card; the relay</text>
<text x="1088" y="502" font-size="12.5" fill="#1F2328">forwards live, stores nothing</text>
<text x="1088" y="527" font-size="12.5" font-weight="700" fill="#1F2328">Scripts</text>
<text x="1088" y="544" font-size="11.5" fill="#1F2328" font-family="ui-monospace, Menlo, monospace">worldlet remote token &lt;name&gt;</text>
<text x="1088" y="569" font-size="12.5" font-weight="700" fill="#1F2328">Tools today</text>
<text x="1088" y="586" font-size="11" fill="#1F2328" font-family="ui-monospace, Menlo, monospace">describe_world_tools · call_world_tool</text>
<rect x="1088" y="622" width="246" height="30" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1" stroke-dasharray="6 4"/>
<text x="1098" y="642" font-size="12" fill="#57606A">planned: search · fetch · remember</text>
<line x1="1358" y1="470" x2="1348" y2="470" stroke="#57606A" stroke-width="2" marker-end="url(#ar)"/>
<line x1="1074" y1="545" x2="1004" y2="545" stroke="#57606A" stroke-width="2" marker-end="url(#ar)"/>
<text x="1088" y="690" font-size="12" fill="#57606A">Out: a Fox turn runs on the person's own</text>
<text x="1088" y="707" font-size="12" fill="#57606A">Agent through its adapter (contracts/HARNESS.md)</text>
<text x="28" y="1030" font-size="12.5" fill="#57606A">Rules: calls go down only (npm run check:arch). UI only reads Context. Only Connectors write Synced. Every Agent, Fox included, reaches Context through the Gate and context/store/context.ts.</text>
</svg>
