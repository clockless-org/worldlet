<text x="28" y="832" font-size="12.5" fill="#57606A">Rules: calls go down only; UI writes the person's own edits straight to the Store. Agents talk to each other through the Store, so it is kept. Only Connectors write Synced. Every Agent, Fox included, passes the Gate.</text>
