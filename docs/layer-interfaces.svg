<text x="28" y="48" font-size="26" font-weight="700" fill="#1F2328">Worldlet: four core layers, two outside interfaces</text>
<text x="28" y="78" font-size="15" fill="#57606A">Everything in the middle works on one Context Store. Outside Agents come in on the left over MCP; outside Services come in on the right through Connectors.</text>
