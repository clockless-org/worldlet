<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bright Smile Dental · Book a cleaning</title>
<!-- Worldlet development rehearsal page. Served only by Dev builds at https://demo.worldlet.test/brightsmile.
     Fictional clinic; nothing leaves this Mac. Booking state lives in this page's local storage. -->
<style>
:root{--ink:#1f3b4d;--muted:#5b7080;--accent:#1f7a8c;--paper:#f7fafb;--line:#d6e2e7}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:18px 32px;background:#fff;border-bottom:1px solid var(--line)}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
header strong{font-size:19px}
main{max-width:620px;margin:40px auto;padding:0 24px}
h1{font-size:30px;line-height:1.2;margin:0 0 8px}
p.lead{color:var(--muted);margin:0 0 28px}
fieldset{border:0;padding:0;margin:0 0 20px}
legend{font-weight:600;margin-bottom:10px}
.slots{display:grid;gap:10px}
.slot{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}
.slot:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 2px #1f7a8c33}
.slot small{color:var(--muted);margin-left:auto}
.onfile{padding:12px 16px;border-radius:12px;background:#eef4f6;color:var(--muted);margin:0 0 24px}
button{width:100%;padding:15px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:600 17px/1 inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.error{color:#a33;min-height:1.5em;margin:8px 0 0}
.done{padding:28px;border-radius:16px;background:#fff;border:1px solid var(--line);text-align:center}
.done .check{width:56px;height:56px;margin:0 auto 12px;border-radius:50%;background:#e2f3ec;color:#1b7a52;display:grid;place-items:center;font-size:28px}
footer{margin:48px auto 24px;max-width:620px;padding:0 24px;color:var(--muted);font-size:13px}
</style>
<header><div class="logo" aria-hidden="true">B</div><strong>Bright Smile Dental</strong></header>
<main id="app">
 <h1>Book your cleaning</h1>
 <p class="lead">Routine cleaning and check-up with Dr. Emily Chen · 45 minutes · No payment needed today.</p>
 <form id="booking" novalidate>
  <fieldset>
   <legend>Choose a time</legend>
   <div class="slots" id="slots"></div>
  </fieldset>
  <p class="onfile">Patient on file: <strong>you@worldlet.test</strong></p>
  <button type="submit" id="book">Book appointment</button>
  <p class="error" id="error" role="alert"></p>
 </form>
</main>
<footer>Worldlet rehearsal site · fictional clinic · nothing is sent anywhere.</footer>
<script>
(function(){
 var KEY='brightsmile-booking';
 function next(weekday,hour,minute){
  var d=new Date();d.setHours(hour,minute,0,0);
  var add=(weekday-d.getDay()+7)%7;if(add===0&&d<=new Date())add=7;
  d.setDate(d.getDate()+add);return d;
 }
 var slots=[next(4,10,0),next(4,15,0),next(5,14,30)];
 function label(d){return d.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})+' · '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});}
 function saved(){try{return JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){return null;}}
 function confirmed(booking){
  document.getElementById('app').innerHTML='<div class="done" role="status"><div class="check" aria-hidden="true">✓</div>'+
   '<h1>You’re booked!</h1><p>Cleaning with Dr. Chen on <strong>'+booking.when+'</strong>.</p>'+
   '<p>Confirmation number <strong id="confirmation">'+booking.reference+'</strong></p>'+
   '<p class="lead">A reminder will be sent to you@worldlet.test.</p></div>';
  document.title='Booked · Bright Smile Dental';
 }
 var existing=saved();if(existing){confirmed(existing);return;}
 var list=document.getElementById('slots');
 slots.forEach(function(d,i){
  var row=document.createElement('label');row.className='slot';
  row.innerHTML='<input type="radio" name="slot" value="'+i+'"><span>'+label(d)+'</span><small>Dr. Chen</small>';
  list.appendChild(row);
 });
 document.getElementById('booking').addEventListener('submit',function(event){
  event.preventDefault();
  var choice=document.querySelector('input[name=slot]:checked');
  if(!choice){document.getElementById('error').textContent='Choose a time to continue.';return;}
  var button=document.getElementById('book');button.disabled=true;button.textContent='Booking…';
  setTimeout(function(){
   var booking={when:label(slots[Number(choice.value)]),reference:'BSD-'+(4000+Math.floor(Math.random()*900))};
   try{localStorage.setItem(KEY,JSON.stringify(booking));}catch(e){}
   confirmed(booking);
  },700);
 });
})();
</script>
</html>
