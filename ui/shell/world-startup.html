<section id="worldStartup" class="world-startup" data-phase="boot" role="status" aria-live="polite" aria-label="Loading your world" aria-busy="true">
  <div class="startup-scene" aria-hidden="true">
    <img class="startup-fox" src="assets/fox-startup.png" width="180" height="180" alt="" fetchpriority="high">
  </div>
  <div class="startup-brand brand-lockup" role="img" aria-label="Worldlet"><img src="brand/worldlet-mark.svg" width="56" height="56" alt=""><span aria-hidden="true">Worldlet</span></div>
  <div class="startup-status">
    <div class="startup-progress" aria-hidden="true"><span></span><span></span><span></span></div>
    <p id="worldStartupPhase" class="startup-phase">Preparing your world</p>
    <button id="worldStartupRetry" type="button" hidden>Try again</button>
  </div>
</section>
