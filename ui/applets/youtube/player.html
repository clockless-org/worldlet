<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><style>html,body,#player{margin:0;width:100%;height:100%;overflow:hidden;background:#151717;color:#fff;font:14px system-ui}#loading{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}</style></head><body><div id="loading">Loading YouTube…</div><div id="player"></div><script>
const initial=__WORLDLET_VIDEO__,identity=__WORLDLET_ORIGIN__;
let player,ready=false,timer;
function report(extra={}){if(!ready&&!extra.error)return;const video=player?.getVideoData?.()||{};window.worldletPlayerReport({id:initial.id,state:ready?player.getPlayerState():-1,seconds:ready?player.getCurrentTime():0,duration:ready?player.getDuration():0,title:String(video.title||'').slice(0,300),...extra});}
window.onYouTubeIframeAPIReady=()=>{player=new YT.Player('player',{width:'100%',height:'100%',videoId:initial.id,playerVars:{playsinline:1,controls:1,origin:identity,enablejsapi:1,start:Math.floor(initial.seconds||0)},events:{onReady(){ready=true;clearTimeout(timer);document.getElementById('loading').remove();report({ready:true});setInterval(()=>report(),1000);},onStateChange(){report()},onError(e){clearTimeout(timer);report({error:Number(e.data)})}}});};
window.worldletPlayerCommand=(operation,seconds)=>{if(!ready)throw Error('The YouTube player is still loading.');if(operation==='play')player.playVideo();else if(operation==='pause')player.pauseVideo();else if(operation==='seek')player.seekTo(Math.max(0,Math.min(seconds,player.getDuration()||seconds)),true);else if(operation!=='status')throw Error('Unknown player command.');report();return {accepted:true};};
timer=setTimeout(()=>report({error:0}),20000);
const script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';script.onerror=()=>report({error:0});document.head.append(script);
</script></body></html>
