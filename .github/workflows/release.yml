name: Release
run-name: ${{ github.event_name == 'push' && format('Dev · {0}', github.event.head_commit.message) || format('{0} {1} {2}', inputs.channel, inputs.build, inputs.platform) }}
# Desktop releases (docs/RELEASING.md). Every push to main runs the Dev tests. The release machines 01 (Windows) and 02
# (Mac) build the signed, numbered Dev packages themselves and publish them to this repository's releases once a
# commit's Dev tests passed; GitHub's runners build no package (owner decision 2026-10-10). A manual alpha or beta run
# promotes a Dev build's exact bytes, taken from its release, once the release machines passed that channel's tests.
# Nothing here runs for pull requests: publishing runs only in the protected `release` environment, which only main can
# use. Pull request CI stays in architecture.yml (Linux only). Only clockless-org/worldlet releases: forks and the
# operations repository, which imports this tree, skip every job.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      channel:
        description: 'The channel to promote a Dev build to'
        type: choice
        options: [alpha, beta]
        default: alpha
      build:
        description: 'Build to promote, for example 4012'
        required: true
      platform:
        description: 'The platform to promote; each platform moves on its own once its release machine passed'
        type: choice
        options: [both, mac, windows]
        default: both
permissions:
  contents: read
# Push runs are not grouped, so every push runs its Dev tests (Linux, about two minutes). Promotions are never cancelled:
# each runs to the end in turn. Publishing never replaces a newer Build in a channel, and installers go up before feeds.
concurrency:
  group: release-${{ github.event_name == 'push' && format('push-{0}', github.run_id) || inputs.channel }}
  cancel-in-progress: false
jobs:
  identity:
    name: Identity
    if: github.repository == 'clockless-org/worldlet' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.identity.outputs.version }}
      build: ${{ steps.identity.outputs.build }}
      label: ${{ steps.identity.outputs.label }}
      builtAt: ${{ steps.identity.outputs.builtAt }}
    steps:
      # Full history without file contents: the Build is the commit's position on main.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: scripts/ci-release.mjs
          sparse-checkout-cone-mode: false
      - id: identity
        run: node scripts/ci-release.mjs identity --count "$(git rev-list --count HEAD)" --committed-at "$(git log -1 --format=%cI HEAD)"

  # The Dev tests (owner decision 2026-10-09): the pull request checks again, on Linux, within five minutes, the pull request UI checks included.
  # The release machines publish a commit's packages only once they passed; a failure opens an Issue for the cloud fixers.
  checks:
    name: Dev tests
    needs: identity
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/architecture.yml

  report:
    name: Report
    needs: checks
    if: always() && !cancelled() && needs.checks.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci-failure-report.mjs
          sparse-checkout-cone-mode: false
      - name: Report the Dev tests
        run: |
          set -euo pipefail
          failed="$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            --jq '[.jobs[] | select((.name | startswith("Dev tests / ")) and .conclusion != "success" and .conclusion != "skipped") | .name | ltrimstr("Dev tests / ")] | join(",")')"
          node scripts/ci-failure-report.mjs --stage dev --platform linux --job "${{ needs.checks.result }}" --failed "$failed" --sha "$GITHUB_SHA" --run "$RUN"

  # Alpha or Beta: the named Dev build's exact bytes, no rebuild. On live Beta its release v<label> becomes the
  # repository's latest release.
  promote:
    name: Promote
    if: github.repository == 'clockless-org/worldlet' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      actions: read
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CHANNEL: ${{ inputs.channel }}
      BUILD: ${{ inputs.build }}
      PLATFORMS: ${{ inputs.platform == 'both' && 'mac windows' || inputs.platform }}
    steps:
      - name: Check the input
        run: '[[ "$BUILD" =~ ^[0-9]{1,5}$ ]] || { echo "Name the Build to promote, for example 4012." >&2; exit 2; }'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !*.png
            !*.webp
            !*.mp4
            !*.m4a
            !*.wav
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.1'
      - run: npm ci --ignore-scripts
      # The release machines upload each Build's installers with their records to its release v<label>. Builds made here
      # before 2026-10-10 have no records there and come from their Actions artifacts (kept 30 days).
      - name: Download the build
        run: |
          set -euo pipefail
          node scripts/ci-release.mjs fetch --build "$BUILD" --dir dist/ci --platform "${PLATFORMS// /,}" && exit 0
          echo "Build $BUILD has no records on its release; trying its Actions artifacts."
          for platform in $PLATFORMS; do
            name="worldlet-$platform-$BUILD"
            run="$(gh api "repos/$GH_REPO/actions/artifacts?name=$name&per_page=1" --jq '.artifacts[0].workflow_run.id // empty')"
            [[ -n "$run" ]] || { echo "No $platform package for Build $BUILD." >&2; exit 1; }
            rm -rf "dist/ci/$platform"
            gh run download "$run" -n "$name" -D "dist/ci/$platform"
          done
      # Only a Build whose commit passed this channel's tests on that platform's release machine leaves Dev: Alpha's on 01
      # (Windows) or 02 (Mac), recorded as the commit statuses worldlet/alpha-windows and worldlet/alpha-mac, Beta's as
      # worldlet/beta-*. Each platform moves on its own (owner decision 2026-10-10; until then both had to pass one
      # commit, docs/RELEASING.md).
      - name: Check the channel's tests
        run: |
          set -euo pipefail
          for platform in $PLATFORMS; do
            sha="$(node -p "require('./dist/ci/$platform/release.json').sourceCommit")"
            state="$(gh api "repos/$GH_REPO/commits/$sha/status" --jq "[.statuses[] | select(.context == \"worldlet/$CHANNEL-$platform\")][0].state // \"\"")"
            [[ "$state" == success ]] || { echo "Build $BUILD ($sha) has not passed the $CHANNEL tests on $platform (worldlet/$CHANNEL-$platform: ${state:-none})." >&2; exit 1; }
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for platform in $PLATFORMS; do
            node scripts/ci-release.mjs publish --channel "$CHANNEL" --platform "$platform" --dir "dist/ci/$platform"
          done
