name: RC
# The release candidate (docs/RELEASING.md): every push to main runs the release gate (scripts/gate.mjs) on Mac and
# Windows runners, split into parts that run side by side so the RC stays within 20 minutes, beside the Release workflow that builds the same commit for Dev. A Build is promoted to Alpha or
# Beta only when both platforms passed here. A failure opens (or adds to) one Issue per platform and failing gates
# (scripts/ci-rc-report.mjs), which a cloud AI session fixes with a normal pull request; a pass closes them. Hosted
# runners are free for this public repository. Nothing here runs for pull requests, and nothing reads a secret.
# Only clockless-org/worldlet runs it: forks and the operations repository, which imports this tree, skip every job.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
permissions:
  contents: read
# The gates that drive a real Codex CLI (test:onboarding, test:agent:local, test:ui:review) need a signed-in Codex,
# which a hosted runner has none of (its refresh tokens are single-use, so no secret copy either); they report SKIP.
env:
  CODEX_SKIP: no Codex sign-in on a hosted runner
  # An RC takes at most 20 minutes (owner decision 2026-10-09): the gate gets what is left after setup, and when it runs
  # out the gate still running is stopped and reported as failing, so the timeout opens an Issue like any failure.
  WORLDLET_GATE_BUDGET_MINUTES: 16
# One RC at a time; while one runs, only the newest push waits (GitHub replaces an older pending run).
concurrency:
  group: rc
  cancel-in-progress: false
jobs:
  # Mac: the gate without test:ui and test:ios, test:ios alone, and test:ui in three shares (it alone took 22 minutes on
  # one hosted Mac, with world startups timing out under four browsers at once).
  mac:
    name: Mac ${{ matrix.part.name }}
    if: github.repository == 'clockless-org/worldlet'
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part:
          - {name: base, skip: 'test:ui,test:ios'}
          - {name: ios, only: 'test:ios'}
          - {name: ui-1, only: 'test:ui', shard: 1/3}
          - {name: ui-2, only: 'test:ui', shard: 2/3}
          - {name: ui-3, only: 'test:ui', shard: 3/3}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.1'
          cache: npm
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/Library/Caches/WorldletBuild
            .local/browser-driver
            .local/imsg
            .local/bootstrap
            .local/hermes-source
            ~/Library/Caches/ms-playwright
          key: mac-rc-${{ hashFiles('platform/web-engine/cef.json', 'package-lock.json', 'harness/hermes/runtime.json', 'scripts/package-agent-browser.ts', 'scripts/package-imsg.ts') }}
          restore-keys: mac-rc-
      - run: npm ci
      # The UI checks' headless Chromium, at the version package-lock.json pins for Playwright.
      - run: npx playwright install chromium
      - if: matrix.part.name == 'base'
        run: npm run setup:hermes
      # test:harness and test:hermes read the interface that test:ui builds, which runs in other parts here.
      - if: matrix.part.name == 'base'
        run: npm run build:native-ui
      - name: Gate
        env:
          WORLDLET_CODEX_GATES_SKIP: ${{ env.CODEX_SKIP }}
          WORLDLET_GATE_RESULTS: ${{ runner.temp }}/gate.json
          WORLDLET_GATE_ONLY: ${{ matrix.part.only }}
          WORLDLET_GATE_SKIP: ${{ matrix.part.skip }}
          WORLDLET_TEST_UI_SHARD: ${{ matrix.part.shard }}
          WORLDLET_TEST_UI_CONCURRENCY: 3
        run: npm run gate
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rc-mac-${{ matrix.part.name }}
          path: ${{ runner.temp }}/gate.json
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: Windows ${{ matrix.part.name }}
    if: github.repository == 'clockless-org/worldlet'
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part:
          - {name: base, skip: 'test:ui'}
          - {name: ui-1, only: 'test:ui', shard: 1/3}
          - {name: ui-2, only: 'test:ui', shard: 2/3}
          - {name: ui-3, only: 'test:ui', shard: 3/3}
    env:
      WORLDLET_SETUP_PYTHON: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.1'
          cache: npm
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~\AppData\Local\WorldletBuild
            .local/browser-driver
            .local/bootstrap
            ~\AppData\Local\ms-playwright
          key: windows-rc-${{ hashFiles('platform/web-engine/cef.json', 'package-lock.json', 'scripts/package-agent-browser.ts') }}
          restore-keys: windows-rc-
      - run: npm ci
      - run: npx playwright install chromium
      # PowerShell, as on the Windows release host: Git Bash's tools would shadow Windows' own on PATH.
      - name: Gate
        shell: pwsh
        env:
          WORLDLET_CODEX_GATES_SKIP: ${{ env.CODEX_SKIP }}
          WORLDLET_GATE_RESULTS: ${{ runner.temp }}\gate.json
          WORLDLET_GATE_ONLY: ${{ matrix.part.only }}
          WORLDLET_GATE_SKIP: ${{ matrix.part.skip }}
          WORLDLET_TEST_UI_SHARD: ${{ matrix.part.shard }}
          WORLDLET_TEST_UI_CONCURRENCY: 2
        run: npm run gate
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rc-windows-${{ matrix.part.name }}
          path: ${{ runner.temp }}\gate.json
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: Report
    needs: [mac, windows]
    if: github.repository == 'clockless-org/worldlet' && always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci-rc-report.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: rc-*
          path: ${{ runner.temp }}/rc
      - name: Mac
        run: node scripts/ci-rc-report.mjs --platform mac --job "${{ needs.mac.result }}" --results "$RUNNER_TEMP/rc" --sha "$GITHUB_SHA" --run "$RUN"
      - name: Windows
        if: always()
        run: node scripts/ci-rc-report.mjs --platform windows --job "${{ needs.windows.result }}" --results "$RUNNER_TEMP/rc" --sha "$GITHUB_SHA" --run "$RUN"
