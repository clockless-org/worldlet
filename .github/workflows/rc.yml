name: RC
# The release candidate (docs/RELEASING.md): every push to main runs the release gate (scripts/gate.mjs), split into
# parts that run side by side so the RC stays within 30 minutes, beside the Release workflow that builds the same commit
# for Dev. Every check runs on Linux runners; Mac and Windows runners run only what needs their platform: the Electron
# host and its web engine, iOS, Android (owner decision 2026-10-09: "默认所有测试都在linux上做，只有必须平台相关的才上mac或windows";
# the free Mac and Windows runners were too slow for the rest). A Build is promoted to Alpha or Beta only when every
# part passed here. A failure opens (or adds to) one Issue per platform and failing gates
# (scripts/ci-rc-report.mjs), which a cloud AI session fixes with a normal pull request; a pass closes them. Hosted
# runners are free for this public repository. Nothing here runs for pull requests, and nothing reads a secret.
# Only clockless-org/worldlet runs it: forks and the operations repository, which imports this tree, skip every job.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
permissions:
  contents: read
# The gates that drive a real Codex CLI (test:onboarding, test:agent:local, test:ui:review) need a signed-in Codex,
# which a hosted runner has none of (its refresh tokens are single-use, so no secret copy either); they report SKIP.
env:
  CODEX_SKIP: no Codex sign-in on a hosted runner
  # An RC takes at most 30 minutes (owner decision 2026-10-09, raised from 20): the gate gets what is left after setup, and when it runs
  # out the gate still running is stopped and reported as failing, so the timeout opens an Issue like any failure.
  WORLDLET_GATE_BUDGET_MINUTES: 26
# One RC at a time; while one runs, only the newest push waits (GitHub replaces an older pending run).
concurrency:
  group: rc
  cancel-in-progress: false
jobs:
  # Mac: the Electron host on macOS, and the iPhone app.
  mac:
    name: Mac ${{ matrix.part.name }}
    if: github.repository == 'clockless-org/worldlet'
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part:
          - {name: electron, only: 'test:electron'}
          - {name: ios, only: 'test:ios'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.1'
          cache: npm
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/Library/Caches/WorldletBuild
            .local/browser-driver
            .local/imsg
            .local/bootstrap
            .local/hermes-source
            ~/Library/Caches/ms-playwright
          key: mac-rc-${{ hashFiles('platform/web-engine/cef.json', 'package-lock.json', 'harness/hermes/runtime.json', 'scripts/package-agent-browser.ts', 'scripts/package-imsg.ts') }}
          restore-keys: mac-rc-
      - run: npm ci
      # The UI checks' headless Chromium, at the version package-lock.json pins for Playwright.
      - run: npx playwright install chromium
      - name: Gate
        env:
          WORLDLET_CODEX_GATES_SKIP: ${{ env.CODEX_SKIP }}
          WORLDLET_GATE_RESULTS: ${{ runner.temp }}/gate.json
          WORLDLET_GATE_ONLY: ${{ matrix.part.only }}
        run: npm run gate
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rc-mac-${{ matrix.part.name }}
          path: ${{ runner.temp }}/gate.json
          if-no-files-found: ignore
          retention-days: 7

  # Windows: the Electron host on Windows, and the Android app (whose emulator runs on Windows here).
  windows:
    name: Windows ${{ matrix.part.name }}
    if: github.repository == 'clockless-org/worldlet'
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part:
          - {name: electron, only: 'test:electron'}
          - {name: android, only: 'test:android'}
    env:
      WORLDLET_SETUP_PYTHON: python
    steps:
      # The checkout keeps the repository's LF line endings, as on the Windows release host: the hosted runner's Git
      # converts to CRLF, and checks comparing generated copies or matching shell scripts then fail.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.1'
          cache: npm
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~\AppData\Local\WorldletBuild
            .local/browser-driver
            .local/bootstrap
            .local/hermes-source
            ~\AppData\Local\ms-playwright
          key: windows-rc-${{ hashFiles('platform/web-engine/cef.json', 'package-lock.json', 'harness/hermes/runtime.json', 'scripts/package-agent-browser.ts') }}
          restore-keys: windows-rc-
      - run: npm ci
      - run: npx playwright install chromium
      # PowerShell, as on the Windows release host: Git Bash's tools would shadow Windows' own on PATH.
      - name: Gate
        shell: pwsh
        env:
          WORLDLET_CODEX_GATES_SKIP: ${{ env.CODEX_SKIP }}
          WORLDLET_GATE_RESULTS: ${{ runner.temp }}\gate.json
          WORLDLET_GATE_ONLY: ${{ matrix.part.only }}
        run: npm run gate
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rc-windows-${{ matrix.part.name }}
          path: ${{ runner.temp }}\gate.json
          if-no-files-found: ignore
          retention-days: 7

  # Linux: every other gate, and test:ui in twelve shares, two checks at a time: each check drives headless Chromium on
  # software WebGL, which keeps a core busy (a local four-core run: world-tour-check took over five minutes beside one
  # other check). Twelve keeps the RC within the free plan's 20 jobs at once beside the Mac, Windows and Dev build jobs.
  # The Electron host's Linux checks need a display: Xvfb.
  linux:
    name: Linux ${{ matrix.part.name }}
    if: github.repository == 'clockless-org/worldlet'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part:
          - {name: base, skip: 'test:ui'}
          - {name: ui-1, only: 'test:ui', shard: 1/12}
          - {name: ui-2, only: 'test:ui', shard: 2/12}
          - {name: ui-3, only: 'test:ui', shard: 3/12}
          - {name: ui-4, only: 'test:ui', shard: 4/12}
          - {name: ui-5, only: 'test:ui', shard: 5/12}
          - {name: ui-6, only: 'test:ui', shard: 6/12}
          - {name: ui-7, only: 'test:ui', shard: 7/12}
          - {name: ui-8, only: 'test:ui', shard: 8/12}
          - {name: ui-9, only: 'test:ui', shard: 9/12}
          - {name: ui-10, only: 'test:ui', shard: 10/12}
          - {name: ui-11, only: 'test:ui', shard: 11/12}
          - {name: ui-12, only: 'test:ui', shard: 12/12}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.1'
          cache: npm
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cache/WorldletBuild
            .local/browser-driver
            .local/bootstrap
            .local/hermes-source
          key: linux-rc-${{ hashFiles('platform/web-engine/cef.json', 'package-lock.json', 'harness/hermes/runtime.json', 'scripts/package-agent-browser.ts') }}
          restore-keys: linux-rc-
      - run: npm ci
      # Chromium with the system libraries it needs on a fresh Ubuntu runner.
      - run: npx playwright install --with-deps chromium
      # test:harness, test:hermes and test:ui's world-gateway-check run in Hermes' Python, as Fox does.
      - run: npm run setup:hermes
      # test:harness and test:hermes read the interface that test:ui builds, which runs in other parts here.
      - if: matrix.part.name == 'base'
        run: npm run build:native-ui
      - name: Gate
        env:
          WORLDLET_CODEX_GATES_SKIP: ${{ env.CODEX_SKIP }}
          WORLDLET_GATE_RESULTS: ${{ runner.temp }}/gate.json
          WORLDLET_GATE_ONLY: ${{ matrix.part.only }}
          WORLDLET_GATE_SKIP: ${{ matrix.part.skip }}
          WORLDLET_TEST_UI_SHARD: ${{ matrix.part.shard }}
          WORLDLET_TEST_UI_CONCURRENCY: 2
        run: xvfb-run -a npm run gate
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rc-linux-${{ matrix.part.name }}
          path: ${{ runner.temp }}/gate.json
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: Report
    needs: [mac, windows, linux]
    if: github.repository == 'clockless-org/worldlet' && always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci-rc-report.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: rc-*
          path: ${{ runner.temp }}/rc
      - name: Mac
        run: node scripts/ci-rc-report.mjs --platform mac --job "${{ needs.mac.result }}" --results "$RUNNER_TEMP/rc" --sha "$GITHUB_SHA" --run "$RUN"
      - name: Windows
        if: always()
        run: node scripts/ci-rc-report.mjs --platform windows --job "${{ needs.windows.result }}" --results "$RUNNER_TEMP/rc" --sha "$GITHUB_SHA" --run "$RUN"
      - name: Linux
        if: always()
        run: node scripts/ci-rc-report.mjs --platform linux --job "${{ needs.linux.result }}" --results "$RUNNER_TEMP/rc" --sha "$GITHUB_SHA" --run "$RUN"
